"}],"mentions":[{"username":"elcancillercom","id":"17706291"}],"hashtags":[],"cashtags":[],"annotations":[],"context_tags":[],"referenced":[{"type":"replied_to","id":"1917178851177685099","text":"[AHORA] \"Qué maravilla que el liberalismo esté de moda\": la diputada bullrichista Sabrina Ajmechet se declaró \"fan\" de la Fundación Libertad. https://t.co/8R4FysUapJ https://t.co/WG7N6XZA8S","author_username":"elcancillercom","author_name":"ElCanciller.com"}],"wayback_ts":"20250429113001","wayback_url":"https://web.archive.org/web/20250429113001/https://twitter.com/PeriodistaRufus/status/1917179559373594923","twitter_url":"https://twitter.com/PeriodistaRufus/status/1917179559373594923"},{"id":"1917185480392650941","created_at":"2025-04-29T11:53:32.000Z","lang":"es","text":"Durante años nos quisieron vender el cuento de que Emilio Monzó fue el Presidente de la Cámara de Diputados que más consensos logró. Hasta periodistas parlamentarios (que ya ni vale la pena nombrar) le escribieron un libro para glorificar su gestión. No solo eso: Monzó mismo se armó su propio eslogan, “Reivindico la rosca”, como si fuera un mérito.\n¿Pero cómo construía esos famosos consensos? Muy simple: gastando más de medio millón de dólares por año en pasajes y viáticos al exterior para los diputados. A eso hay que sumarle la enorme cantidad de contratos que repartió durante su presidencia, usando los recursos del Estado como moneda de cambio para aceitar su “rosca” política.\nY ahora pretende jugar al personaje que defiende las instituciones, cuando en realidad fue uno de los que más las degradó usando fondos públicos como caja. \nEsa es la verdadera historia que nunca te contaron.","author_id":"1788584093388611585","author_username":"PeriodistaRufus","author_name":"Rufus","author_profile_image_url":"https://pbs.twimg.com/profile_images/1895833443725942784/NX-xYj4G_normal.jpg","conversation_id":"1917185480392650941","possibly_sensitive":false,"public_metrics":{"retweet_count":0,"reply_count":0,"l resultados? Confunden deseo con realidad. \n\nLo que está ocurriendo en el norte argentino es una verdadera irrupción política que desarma el esquema tradicional y marca el inicio de una nueva etapa. La Libertad Avanza emergió como una fuerza opositora real, con representación legislativa, base urbana sólida y proyección de crecimiento.  \n\nEn Salta, fue la fuerza más votada en la capital provincial (que concentra el 41% del padrón), ganó un senador, 9 diputados, 6 concejales y 12 convencionales. En 2021 y 2023 ni siquiera compitieron. Hoy es la segunda fuerza legislativa y la primera oposición real al saencismo.\n\nEn Jujuy, en su primera elección provincial, LLA logró más del 21% de los votos, superando al PJ y al FIT, ganando 7 bancas y arrasando en San Salvador. El radicalismo retuvo la provincia, pero con una oposición nueva y con anclaje urbano.\n\nEn Chaco, en alianza con el oficialismo, el espacio libertario se impuso y logró cortar una serie de victorias peronistas. Esto demuestra que LLA no sólo crece sola, también suma volumen en acuerdos estratégicos para disputar poder real.\n\nLo que hay no es una derrota, sino una reconfiguración: los libertarios ocuparon el vacío opositor, captaron al votante desencantado de la grieta y transformaron el tablero político del norte. Mientras los partidos tradicionales se diluyen, LLA se consolida como la única alternativa con proyección real.\n\nEl fenómeno es claro: no es retroceso, es génesis.","author_id":"1788584093388611585","author_username":"PeriodistaRufus","author_name":"Rufus","author_profile_image_url":"https://pbs.twimg.com/profile_images/1895833443725942784/NX-xYj4G_normal.jpg","conversation_id":"1922251966899482966","possibly_sensitive":false,"public_metrics":{"retweet_count":0,"reply_count":0,"like_count":0,"quote_count":0,"bookmark_count":0,"impression_count":0},"urls":[{"short_url":"https://t.co/XP6AmsFhGa","expanded_url":"https://x.com/PeriodistaRufus/status/1922251966899482966/photo/1","display_url" <script>
const DATA = JSON.parse(document.getElementById('TWEETS_DATA').textContent);
const fmt = new Intl.NumberFormat('es-AR');
const dateFmt = new Intl.DateTimeFormat('es-AR', { year:'numeric', month:'short', day:'2-digit' });
const timeFmt = new Intl.DateTimeFormat('es-AR', { hour:'2-digit', minute:'2-digit' });
const TYPE_LABEL = { replied_to:'Respondiendo a', quoted:'Citando a', retweeted:'Retuiteando a' };

function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function escHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function linkify(text, urls, mentions){
  let out = escHtml(text);
  (urls||[]).forEach(u=>{ if(!u.short_url) return;
    const short=escHtml(u.short_url), expanded=u.expanded_url||u.short_url, disp=u.display_url||expanded;
    out=out.replace(new RegExp(escRegex(short),'g'),`<a href="${escHtml(expanded)}" target="_blank" rel="noopener">${escHtml(disp)}</a>`);
  });
  (mentions||[]).forEach(m=>{ if(!m.username) return;
    out=out.replace(new RegExp('@'+escRegex(m.username)+'\\b','gi'),`<a href="https://twitter.com/${escHtml(m.username)}" target="_blank" rel="noopener">@${escHtml(m.username)}</a>`);
  });
  out=out.replace(/(^|\s)#(\w+)/g,'$1<a href="https://twitter.com/hashtag/$2" target="_blank" rel="noopener">#$2</a>');
  out=out.replace(/(^|[\s(])(https?:\/\/[^\s<]+?)(?=[\s)<]|$)/g,(m,pre,url)=>{
    if(out.includes('href="'+escHtml(url))) return m;
    return pre+`<a href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(url)}</a>`;
  });
  return out;
}
function refType(t){
  if(!t.referenced||!t.referenced.length) return 'original';
  const types=t.referenced.map(r=>r.type);
  if(types.includes('retweeted')) return 'retweeted';
  if(types.includes('quoted')) return 'quoted';
  if(types.includes('replied_to')) return 'replied_to';
  return 'original';
}

const tagCounts=new Map();
for(const t of DATA) for(const ct of (t.context_tags||[])) tagCounts.set(ct.name,(tagCounts.get(ct.name)||0)+1);
const tagSel=document.getElementById('tag');
for(const [name,c] of [...tagCounts.entries()].sort((a,b)=>b[1]-a[1])){
  const o=document.createElement('option'); o.value=name; o.textContent=`${name} (${c})`; tagSel.appendChild(o);
}

const allDates=DATA.map(t=>t.created_at).filter(Boolean).sort();
const minDate=allDates[0].slice(0,10), maxDate=allDates[allDates.length-1].slice(0,10);
document.getElementById('stats').textContent=`${fmt.format(DATA.length)} tuits · del ${dateFmt.format(new Date(allDates[0]))} al ${dateFmt.format(new Date(allDates[allDates.length-1]))}`;
// set date input bounds
const fromEl=document.getElementById('from'), toEl=document.getElementById('to');
fromEl.min=toEl.min=minDate; fromEl.max=toEl.max=maxDate;

function avatarLetter(t){ return (t.author_name||'R').trim().charAt(0).toUpperCase(); }

function renderTweet(t, query){
  const pm=t.public_metrics||{};
  const text=linkify(t.text||'', t.urls, t.mentions);
  const refs=(t.referenced||[]).map(r=>{
    const label=TYPE_LABEL[r.type]||r.type;
    const who=r.author_username?`@${escHtml(r.author_username)}`:'';
    const body=r.text?escHtml(r.text):'<em style="color:var(--muted)">(tuit no incluido en el snapshot)</em>';
    return `<div class="ref"><div class="reftype">${label} ${who}</div><div class="refbody">${body}</div></div>`;
  }).join('');
  const urlCards=(t.urls||[]).filter(u=>u.expanded_url&&!u.media_key).slice(0,3).map(u=>{
    let domain=''; try{ domain=new URL(u.expanded_url).hostname.replace(/^www\./,''); }catch{}
    if(domain.includes('twitter.com')||domain.includes('x.com')) return '';
    return `<a class="urlcard" href="${escHtml(u.expanded_url)}" target="_blank" rel="noopener">${u.title?`<div class="uctitle">${escHtml(u.title)}</div>`:''}${u.description?`<div>${escHtml(u.description)}</div>`:''}<div class="ucdomain">${escHtml(domain||u.display_url||u.expanded_url)}</div></a>`;
  }).join('');
  const ctags=(t.context_tags||[]).slice(0,8).map(x=>`<span class="tag">${escHtml(x.name)}</span>`).join('');
  const m=(k,label)=>pm[k]?`<span title="${label}">${fmt.format(pm[k])} ${label}</span>`:'';
  const metrics=[m('like_count','me gusta'),m('retweet_count','RT'),m('reply_count','resp.'),m('quote_count','citas'),m('impression_count','vistas')].filter(Boolean).join('');
  const created=t.created_at?new Date(t.created_at):null;
  const dateStr=created?`${dateFmt.format(created)} · ${timeFmt.format(created)}`:'';
  const article=document.createElement('article'); article.className='tweet';
  article.innerHTML=`<div class="avatar">${avatarLetter(t)}</div><div>
    <div class="meta"><span class="name">${escHtml(t.author_name||'Rufus')}</span><span class="handle">@${escHtml(t.author_username||'PeriodistaRufus')}</span><span class="dot">·</span><span class="date">${dateStr}</span></div>
    ${refs}<div class="text">${text}</div>
    ${urlCards?`<div class="urlcards">${urlCards}</div>`:''}
    ${ctags?`<div class="tags">${ctags}</div>`:''}
    <div class="metrics">${metrics}</div>
    <div class="actionrow"><a href="${escHtml(t.wayback_url)}" target="_blank" rel="noopener">Ver snapshot</a><a href="${escHtml(t.twitter_url)}" target="_blank" rel="noopener">Twitter / X</a></div>
  </div>`;
  if(query) article.querySelectorAll('.text, .refbody, .urlcard').forEach(n=>highlightInNode(n,query));
  return article;
}
function highlightInNode(node,q){
  if(!q||!node) return;
  const qn=norm(q); if(!qn) return;
  const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT); const tns=[];
  while(walker.nextNode()) tns.push(walker.currentNode);
  for(const tn of tns){
    const orig=tn.textContent, lower=norm(orig);
    if(lower.indexOf(qn)===-1) continue;
    let html='',i=0;
    while(i<lower.length){
      const j=lower.indexOf(qn,i);
      if(j===-1){ html+=escHtml(orig.slice(i)); break; }
      html+=escHtml(orig.slice(i,j))+'<mark>'+escHtml(orig.slice(j,j+qn.length))+'</mark>'; i=j+qn.length;
    }
    const span=document.createElement('span'); span.innerHTML=html; tn.replaceWith(span);
  }
}
function getFilters(){
  return { q:document.getElementById('q').value.trim(), type:document.getElementById('type').value,
           tag:document.getElementById('tag').value, sort:document.getElementById('sort').value,
           from:fromEl.value, to:toEl.value };
}
function haystack(t){
  if(t.__hay) return t.__hay;
  const parts=[t.text||'',t.author_name||'',t.author_username||'',
    ...(t.mentions||[]).map(m=>m.username||''),...(t.hashtags||[]),
    ...(t.context_tags||[]).map(x=>x.name||''),
    ...(t.urls||[]).flatMap(u=>[u.expanded_url||'',u.title||'',u.description||'',u.display_url||'']),
    ...(t.referenced||[]).flatMap(r=>[r.text||'',r.author_username||'',r.author_name||''])];
  t.__hay=norm(parts.join(' \n ')); return t.__hay;
}
function applyFilters(){
  const f=getFilters(); let list=DATA.slice();
  if(f.type) list=list.filter(t=>refType(t)===f.type);
  if(f.tag) list=list.filter(t=>(t.context_tags||[]).some(x=>x.name===f.tag));
  if(f.from) list=list.filter(t=>(t.created_at||'').slice(0,10)>=f.from);
  if(f.to) list=list.filter(t=>(t.created_at||'').slice(0,10)<=f.to);
  if(f.q){ const qn=norm(f.q); if(qn) list=list.filter(t=>haystack(t).includes(qn)); }
  switch(f.sort){
    case 'old': list.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')); break;
    case 'like': list.sort((a,b)=>(b.public_metrics?.like_count||0)-(a.public_metrics?.like_count||0)); break;
    case 'rt': list.sort((a,b)=>(b.public_metrics?.retweet_count||0)-(a.public_metrics?.retweet_count||0)); break;
    case 'imp': list.sort((a,b)=>(b.public_metrics?.impression_count||0)-(a.public_metrics?.impression_count||0)); break;
    default: list.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  }
  return list;
}
const feed=document.getElementById('feed'), empty=document.getElementById('empty'), rc=document.getElementById('resultCount');
let renderCursor=0; const BATCH=60; let currentList=[];
function resetAndRender(){
  feed.innerHTML=''; currentList=applyFilters(); renderCursor=0;
  rc.textContent=`${fmt.format(currentList.length)} resultado${currentList.length===1?'':'s'}`;
  empty.style.display=currentList.length?'none':'block'; renderMore();
}
function renderMore(){
  const f=getFilters(); const next=currentList.slice(renderCursor,renderCursor+BATCH);
  const frag=document.createDocumentFragment(); for(const t of next) frag.appendChild(renderTweet(t,f.q));
  feed.appendChild(frag); renderCursor+=next.length;
}
const sentinel=document.createElement('div'); sentinel.style.height='1px'; feed.parentNode.appendChild(sentinel);
new IntersectionObserver(e=>{ if(e[0].isIntersecting&&renderCursor<currentList.length) renderMore(); }).observe(sentinel);
let debounce; function onChange(){ clearTimeout(debounce); debounce=setTimeout(resetAndRender,120); }
document.getElementById('q').addEventListener('input',onChange);
for(const id of ['type','tag','sort','from','to']) document.getElementById(id).addEventListener('change',resetAndRender);
document.getElementById('clear').addEventListener('click',()=>{
  document.getElementById('q').value=''; document.getElementById('type').value='';
  document.getElementById('tag').value=''; document.getElementById('sort').value='new';
  fromEl.value=''; toEl.value=''; resetAndRender();
});
resetAndRender();
</script>
