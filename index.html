<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivo de @PeriodistaRufus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>Archivo de Rufus <span class="badge">@PeriodistaRufus</span></h1>
    <div class="sub">Archivo navegable de tuits capturados por la Wayback Machine</div>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Buscar texto, menciones, etiquetas…" />
      <select id="type">
        <option value="">Tipo: todos</option>
        <option value="original">Originales</option>
        <option value="replied_to">Respuestas</option>
        <option value="quoted">Citas</option>
        <option value="retweeted">Retweets</option>
      </select>
      <select id="tag">
        <option value="">Etiqueta: todas</option>
      </select>
      <select id="sort">
        <option value="new">Más recientes</option>
        <option value="old">Más antiguos</option>
        <option value="like">Más me gusta</option>
        <option value="rt">Más retuiteados</option>
        <option value="imp">Más vistos</option>
      </select>
    </div>
  </header>

  <div class="resultcount" id="resultCount"></div>
  <main id="feed"></main>

  <div class="empty" id="empty" style="display:none">Sin resultados para esta búsqueda.</div>

  <footer class="site">
    Generado a partir de <a href="https://web.archive.org/web/*/https://twitter.com/PeriodistaRufus/*" style="color:var(--accent)">snapshots de la Wayback Machine</a>.
  </footer>
</div>

<script src="app.js"></script>
<!-- Vercel Web Analytics (sólo activo en el sitio deployado en Vercel) -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<!-- Vercel Speed Insights (opcional) -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

</body>
</html>
